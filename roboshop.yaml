- name: create ec2 instance and route53 records
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    img_id: ami-0055977a6e828a4f4
    domain_name: joindevops.store
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: roboshop-"{{ list }}"
      image_id: "{{ img_id }}"
      instance_type: t3.micro
      secuirty_groups:
      - roboshop-common
      - roboshop-"{{ list }}"
      region: us-east-1
    
    loop: "{{ instances }}"
    when: action == "create"


