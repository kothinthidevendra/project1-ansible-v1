- name: configuration of rabbitmq
  hosts: rabbitmq
  become: yes
  tasks:
  - name: copy rabbitmq repo file
    copy:
      src: rabbitmq.repo
      dest: /etc/yum.repos.d/rabbitmq.repo
  
  - name: installation of rabbitmq
    package:
      name: 
      - erlang
      - rabbitmq-server
      state: present
  
  - name: enabling and starting rabbitmq rabbitmq-server
    service:
      name: rabbitmq-server
      state: started
      enabled: yes

  - name: 
  community.rabbitmq.rabbitmq_user:
    user: "roboshop"
    password: "{{ rabbitmq_roboshop_password }}"
    vhost: "/"
    configure_priv: ".*"
    write_priv: ".*"
    read_priv: ".*"
    tags: "management"
    state: present