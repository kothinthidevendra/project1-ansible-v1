- name: create ec2 instances and r53 records
  hosts: local
  connection: local
  vars:
    # ansible-playbook roboshop.yaml -e "instances=['mongodb', 'redis']"
    # ansible-playbook roboshop.yaml -e "action=delete"
    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: joindevops.store
    ami_id: ami-0055977a6e828a4f4
  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups:
      - roboshop-common
      - "roboshop-{{ item }}"
      region: us-east-1
    loop: "{{ instances }}"
    when: action == "create"

- name: create ec2 instance and r53 records
  hosts: localhost
  connection: local
  vars:
    instances: ["mongodb", "mysql", "redis", "rabbitmq"]
    domain_name: joindevops.store
    img_id: ami-0055977a6e828a4f4
    task: create
  tasks:
    - name: create ec2 instance
      amazon.aws.ec2_instance:
        name: roboshop-"{{ item }}"
        image_id: "{{ img_id }}"
        instance_type: t3.micro
        security_groups:
        - roboshop-common
        - roboshop-"{{ item }}"
        region: us-east-1
      
      loop: "{{ instances }}"
      when: task == "create"