- name: configuration of mysql
  hosts: mysql
  become: yes
  tasks:
  - name: enabling mysql-8.4 module
    command: dnf module enable mysql:8.4 -y

  - name: mysql installation
    package:
      name: mysql-server
      state: present

  - name: enabling and starting the mysql server
    service:
      name: mysqld
      state: started
      enabled: yes

  - name: setting mysql root password
    command: mysql_secure_installation --set-root-pass "{{ mysql_root_password }}"